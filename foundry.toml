[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.34"
# Default profile uses the legacy (Yul-free) pipeline for fast compilation.
# This is what `forge test`, `forge build` (no profile flag), `forge fmt`, and
# the bulk of CI jobs run under. Build time is ~40 s vs ~5 min under the IR
# pipeline. This profile is intentionally not the deploy-size source of truth;
# async-premium restoration plus test-friendly optimizer settings can push
# PartialSettler over EIP-170. That is fine for `forge test` because the
# in-test EVM accepts the deployment (constructor returns successfully), and
# `forge build` without the `--sizes` flag does not enforce EIP-170 either.
#
# Production size enforcement is delegated to the `deploy` profile + the
# `Size Gate` CI job, which run `via_ir = true` + `optimizer_runs = 1` to fit
# PartialSettler / ExactSettler under 24,576 B. See ext-3.
via_ir = false
optimizer = true
optimizer_runs = 200
dynamic_test_linking = true
evm_version = "cancun"
bytecode_hash = "none"
cbor_metadata = false
# Solc 0.8.34 emits one transient-storage composability warning per use site,
# one initcode-size warning for most test contracts, and default-profile
# contract-size warnings for artifacts that are built for tests rather than
# deployment. These are intentional here: ReentrancyGuardTransient is load-bearing,
# tests are never deployed to mainnet, and deploy-size enforcement lives in the
# `deploy` profile + Size Gate described below.
ignored_error_codes = [2394, 3860, 5574]
gas_reports = ["*"]
fs_permissions = [
  { access = "read", path = "./" },
  { access = "read-write", path = "./networks.json" },
]

[profile.default.fuzz]
runs = 256
max_test_rejects = 65536

# Deploy profile — used to build the production artifacts that ship onchain
# (BaseSettler / ExactSettler / PartialSettler / CorkRolloverContract / CorkRolloverContractFactory).
# Runs the Yul IR pipeline at `optimizer_runs = 1` for minimum bytecode size.
# This is what the Size Gate CI job uses and what deployment scripts should
# select via `FOUNDRY_PROFILE=deploy`. Builds are ~3-5× slower than default.
#
# Operator-locked under ext-1 (Cand 11 direct-fill cPT-holder EIP-712 sig) because
# the cPT-holder-sig admission gate is an audit-readiness requirement (Pashov F-05)
# and the legacy/yul codegen path's bytecode for BaseSettler+PartialSettler
# exceeded EIP-170 after the addition. via_ir + runs=1 plus the external
# filler-payload decoder keeps PartialSettler below EIP-170. Supersedes PR #24
# (feature-no-via-ir-stack-fix);
# the structural cause for that PR (stack-too-deep on Filler/EvcRolloverAdapter
# `execute` selectors with struct params) is mitigated by via_ir's IR-level
# stack scheduling.
[profile.deploy]
src = "src"
out = "out"
libs = ["lib"]
# Deploy profile builds production/script artifacts only; tests run under default/ci profiles.
test = "deploy-no-tests"
script = "script"
solc = "0.8.34"
via_ir = true
optimizer = true
optimizer_runs = 1
dynamic_test_linking = false
evm_version = "cancun"
bytecode_hash = "none"
cbor_metadata = false
ignored_error_codes = []
gas_reports = ["*"]
fs_permissions = [
  { access = "read", path = "./" },
  { access = "read-write", path = "./networks.json" },
]

[profile.deploy.fuzz]
runs = 256
max_test_rejects = 65536

# CI profile — inherits the default (fast) pipeline. Only overrides the fuzz
# and invariant budgets so CI exercises more inputs than a local `forge test`.
# `via_ir` deliberately NOT set here: CI test jobs run the legacy pipeline.
[profile.ci]
fuzz = { runs = 10000 }

[profile.ci.invariant]
runs = 256
depth = 50
fail_on_revert = false

[profile.ci-deep.invariant]
runs = 5000
depth = 50
fail_on_revert = false

[profile.audit.invariant]
runs = 10000
depth = 100
fail_on_revert = false

# Fast profile used by scripts/mutation/run-gambit.sh. Shrinks the fuzz and
# invariant budgets so each mutant build+test round trip is seconds, not minutes.
# Correctness is the same as the default profile; only speed changes. Inherits
# the default profile's legacy pipeline — mutation testing benefits from fast
# compilation, not from IR-pipeline bytecode tightness.
[profile.mutation]
via_ir = false
optimizer = true
optimizer_runs = 200

[profile.mutation.fuzz]
runs = 16

[profile.mutation.invariant]
runs = 8
depth = 10
fail_on_revert = false

[invariant]
runs = 32
depth = 15
fail_on_revert = false

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
sort_imports = true
single_line_statement_blocks = "multi"

[lint]
# Inline assembly is a readability/audit regression for canonical EIP-712 typehash
# hashing (`keccak256(abi.encode(typehash, ...))`); the standard Solidity form
# stays auditor-friendly. Excluded globally rather than via per-call directives.
exclude_lints = ["asm-keccak256"]
